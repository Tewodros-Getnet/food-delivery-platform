name: food_delivery_rider
description: Tana Driver - Deliver with flexibility
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^2.0.3+1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  geolocator: ^11.0.0
  go_router: ^13.0.1
  url_launcher: ^6.2.4
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 26
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
